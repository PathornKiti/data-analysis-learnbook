[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ridekit"
version = "0.1.0"
description = "Module 6.5 exercise: a tiny analysis package for the daily_rides data"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
