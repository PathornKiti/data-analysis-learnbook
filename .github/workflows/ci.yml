name: CI

on:
  push:
  pull_request:

jobs:
  notebooks:
    name: Run lessons and solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt nbconvert
      - name: Execute lesson and solution notebooks
        env:
          MPLBACKEND: Agg
        run: |
          set -e
          for nb in modules/*/lesson.ipynb modules/00-setup/check_environment.ipynb solutions/*/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/out/$(dirname "$nb")" "$nb"
            echo "::endgroup::"
          done
      - name: Notebooks are valid and have no stored outputs
        run: |
          python - <<'PY'
          import glob, nbformat
          bad = []
          paths = [p for pattern in ("modules/**/*.ipynb", "solutions/**/*.ipynb", "projects/**/*.ipynb") for p in glob.glob(pattern, recursive=True)]
          for p in paths:
              nb = nbformat.read(p, 4)
              nbformat.validate(nb)
              if any(c.cell_type == "code" and (c.outputs or c.execution_count) for c in nb.cells):
                  bad.append(p)
          assert not bad, f"Clear outputs before committing: {bad}"
          print(f"{len(paths)} notebooks valid and clean.")
          PY

  unsolved-exercises:
    name: Unsolved exercises must not pass their own checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt nbconvert
      - env:
          MPLBACKEND: Agg
        run: |
          for nb in modules/*/exercises.ipynb; do
            jupyter nbconvert --to notebook --execute --allow-errors --output-dir "$RUNNER_TEMP/unsolved/$(dirname "$nb")" "$nb" >/dev/null 2>&1
            python - "$RUNNER_TEMP/unsolved/$nb" "$nb" <<'PY'
          import sys, nbformat
          out, name = sys.argv[1], sys.argv[2]
          nb = nbformat.read(out, 4)
          passed = sum("✅" in "".join(o.get("text", "") for o in c.get("outputs", [])) for c in nb.cells if c.cell_type == "code")
          print(f"{name}: {passed} checks passed while unsolved")
          assert passed == 0, f"{name}: a starter already passes its check"
          PY
          done

  datasets:
    name: Dataset generator still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - run: python data/generate_datasets.py
      - name: Generated files have the documented shape
        run: |
          python - <<'PY'
          import pandas as pd
          s = pd.read_csv("data/students.csv"); r = pd.read_csv("data/daily_rides.csv")
          assert s.shape == (200, 7), s.shape
          assert r.shape == (366, 5), r.shape
          assert r["temp_c"].isna().sum() == 6
          o = pd.read_csv("data/messy_orders.csv")
          assert o.shape == (312, 7), o.shape
          assert o.duplicated().sum() == 12
          t = pd.read_csv("data/app_trial.csv"); d = pd.read_csv("data/service_desk.csv")
          assert t.shape == (300, 8) and t["group"].value_counts().eq(100).all(), t.shape
          assert d.shape == (480, 5), d.shape
          L = pd.read_csv("data/longitudinal_scores.csv"); C = pd.read_csv("data/customer_churn.csv"); M = pd.read_csv("data/monthly_demand.csv")
          assert L.shape == (381, 4) and L["student_id"].nunique() == 80, L.shape
          assert C.shape == (400, 5) and C["churned"].sum() == 302, C.shape
          assert M.shape == (144, 3) and M["promo"].sum() == 30, M.shape
          print("datasets OK")
          PY

  project-template:
    name: Project template runs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt nbconvert
      - run: pytest
      - run: python run_analysis.py
      - name: Execute template notebooks
        env:
          MPLBACKEND: Agg
        run: |
          for nb in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/out" "$nb"
          done

  worked-example:
    name: Worked example runs and passes the project doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r projects/worked-example/requirements.txt nbconvert
        working-directory: projects/worked-example
      - run: pytest
        working-directory: projects/worked-example
      - run: python run_analysis.py
        working-directory: projects/worked-example
        env:
          MPLBACKEND: Agg
      - name: Execute worked-example notebooks
        working-directory: projects/worked-example
        env:
          MPLBACKEND: Agg
        run: |
          for nb in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/out" "$nb"
          done
      - name: Project doctor passes on the worked example and the template
        env:
          MPLBACKEND: Agg
        run: |
          pip install -r projects/template/requirements.txt
          python projects/check_project.py projects/worked-example
          python projects/check_project.py projects/template

  package-exercises:
    name: Package exercises (6.5 and 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas pytest
      - name: 6.5 reference solution passes all tests
        working-directory: solutions/06b-notebook-to-module/exercise
        run: pytest -q
      - name: 6.5 student exercise is still a stub (tests must fail until implemented)
        working-directory: modules/06b-notebook-to-module/exercise
        run: |
          pytest --collect-only -q
          if pytest -q -x; then echo "Exercise tests pass without work: stubs were filled in!"; exit 1; fi
      - name: 11 reference tests pass and catch every injected bug
        working-directory: solutions/11-communicating-results/exercise
        run: |
          pytest -q
          python checker/check_my_tests.py
      - name: 11 student stub still lets bugs survive
        working-directory: modules/11-communicating-results/exercise
        run: |
          pytest -q
          if python checker/check_my_tests.py; then echo "The stub already catches every bug: the TODO tests were filled in!"; exit 1; fi
